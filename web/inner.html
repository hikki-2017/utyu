<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INNER COSMOS</title>
<style>
  :root { --fg:#e8ecff; --dim:#8a93b8; }
  html, body { margin:0; height:100%; background:#000; color:var(--fg);
    font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif; overflow:hidden; }
  canvas#gl { position:fixed; inset:0; display:block; touch-action:none; }
  video { display:none; }
  #emotion { position:fixed; left:16px; bottom:16px; z-index:55; display:flex; gap:12px; align-items:center;
    padding:10px 14px 10px 10px; border-radius:16px; background:rgba(8,11,22,.62);
    border:1px solid rgba(232,236,255,.13); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  #emotion .cam { position:relative; width:104px; height:78px; border-radius:11px; overflow:hidden;
    background:#05070e; flex:none; }
  #emotion .cam video { display:block; width:100%; height:100%; object-fit:cover; transform:scaleX(-1);
    filter:saturate(.55) contrast(1.05); }
  #emotion .cam .scan { position:absolute; left:0; right:0; height:2px; top:0;
    background:linear-gradient(90deg,transparent,rgba(127,216,255,.85),transparent); animation:scan 2.6s linear infinite; }
  @keyframes scan { from { transform:translateY(0) } to { transform:translateY(78px) } }
  #emotion .vit { min-width:132px; }
  #emotion .row { display:flex; align-items:baseline; gap:7px; }
  #emotion .ring { width:11px; height:11px; border-radius:50%; background:#ff5f7a; flex:none;
    box-shadow:0 0 12px #ff5f7a; animation:beat 1s ease-out infinite; align-self:center; }
  @keyframes beat { 0% { transform:scale(.72); opacity:.65 } 18% { transform:scale(1.3); opacity:1 } 100% { transform:scale(.72); opacity:.65 } }
  #emotion b { font-size:30px; font-weight:700; letter-spacing:-.02em; line-height:1; color:var(--fg); }
  #emotion small { font-size:11px; color:var(--dim); }
  #emotion .lab { font-size:15px; font-weight:600; margin-top:4px; color:#9fd8ff; letter-spacing:.02em; }
  #emotion .bar { height:4px; border-radius:2px; background:rgba(232,236,255,.13); margin-top:7px; overflow:hidden; }
  #emotion .bar i { display:block; height:100%; width:0%; border-radius:2px;
    background:linear-gradient(90deg,#30d158,#ffd60a,#ff453a); transition:width .5s ease; }
  #emotion .src { font-size:10px; color:var(--dim); margin-top:5px; }
  body.stage-intro #emotion, body.stage-prelude #emotion { opacity:0; pointer-events:none; }
  body.hide-hud #emotion { opacity:0; }
  @media (max-width:860px) { #emotion { left:10px; bottom:10px; padding:8px; gap:9px; }
    #emotion .cam { width:78px; height:58px; } #emotion b { font-size:23px; } #emotion .vit { min-width:104px; } }
  .ui { transition:opacity .8s; }
  body.stage-intro .ui, body.stage-prelude .ui { opacity:0; pointer-events:none; }
  body.hide-hud #hud, body.hide-hud #mode, body.hide-hud #controls { opacity:0; pointer-events:none; }
  #hud { position:fixed; top:16px; right:16px; text-align:right; font-size:13px; line-height:1.8;
    color:var(--dim); pointer-events:none; }
  #hud b { color:var(--fg); font-weight:600; }
  #hud .state { font-size:16px; color:var(--fg); letter-spacing:.1em; }
  #hud .born { font-size:22px; color:var(--fg); letter-spacing:.05em; }
  #mode { position:fixed; top:16px; left:16px; font-size:12px; color:var(--dim); letter-spacing:.2em; }
  #narration { position:fixed; left:50%; bottom:92px; transform:translateX(-50%); width:min(760px,90vw);
    text-align:center; font-size:clamp(16px,2.4vw,24px); letter-spacing:.06em; line-height:1.7;
    opacity:0; transition:opacity 1.2s; text-shadow:0 0 18px rgba(0,0,0,.95); pointer-events:none; }
  #center { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:16px; font-weight:200; font-size:clamp(22px,4vw,40px); letter-spacing:.2em; line-height:2;
    opacity:0; transition:opacity 1.4s; pointer-events:none; text-shadow:0 0 24px #000, 0 0 12px #000, 0 0 4px #000; }
  #center.on { opacity:1; }
  body.stage-prelude #center { padding-top:24vh; }
  #center.small { font-size:clamp(18px,3vw,32px); letter-spacing:.14em; }
  #controls { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); display:flex; gap:10px; }
  button { background:rgba(255,255,255,.07); color:var(--fg); border:1px solid rgba(255,255,255,.25);
    padding:10px 20px; border-radius:999px; font-size:14px; cursor:pointer; font-family:inherit; white-space:nowrap; }
  button:hover { background:rgba(255,255,255,.16); }
  #intro, #weekform { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; background:#000; z-index:10; text-align:center; padding:16px; transition:opacity .8s; }
  #intro h1 { font-weight:200; letter-spacing:.35em; font-size:clamp(28px,6vw,60px); margin:0 0 20px; }
  #intro p { color:var(--dim); margin:0 0 36px; line-height:2; }
  #weekform { display:none; }
  #weekform .q { font-weight:200; letter-spacing:.1em; font-size:clamp(20px,3.4vw,32px); margin:0 0 8px; }
  #weekform .sub { color:var(--dim); font-size:13px; margin:0 0 28px; letter-spacing:.05em; }
  #week-input { width:min(560px,86vw); background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.3);
    border-radius:14px; color:var(--fg); font-size:17px; padding:16px 18px; font-family:inherit; text-align:center;
    outline:none; }
  #week-input:focus { border-color:rgba(255,255,255,.6); }
  #week-input::placeholder { color:#5c6489; }
  #weekform button { margin-top:20px; }
  @media (max-width:560px) { #hud { font-size:11px; } #controls button { padding:9px 14px; font-size:13px; } }
#real-badge{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:60;text-align:center;
  padding:10px 22px;border-radius:18px;background:rgba(10,14,26,.66);border:1px solid rgba(127,216,255,.34);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);pointer-events:none;line-height:1.25}
#real-badge b{display:block;font-size:46px;font-weight:700;color:#7fd8ff;letter-spacing:-.02em}
#real-badge span{display:block;font-size:13px;color:rgba(235,235,245,.7);margin-top:2px}
#real-badge .rlog{margin-top:8px;font-size:11px;color:rgba(235,235,245,.5)}
#real-badge .rlog em{font-style:normal;color:rgba(127,216,255,.75)}
@media(max-width:860px){#real-badge{bottom:84px;padding:8px 16px}#real-badge b{font-size:34px}}
#const-badge{position:fixed;right:16px;bottom:16px;z-index:56;text-align:right;font-size:12px;
  color:rgba(235,235,245,.62);line-height:1.5;pointer-events:none}
#const-badge b{display:block;font-size:26px;font-weight:700;color:#ffd77a;letter-spacing:-.02em}
#const-badge .list{margin-top:6px;font-size:11px;color:rgba(235,235,245,.45)}
#const-banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.94);z-index:70;
  text-align:center;opacity:0;transition:opacity .45s,transform .45s;pointer-events:none}
#const-banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#const-banner b{display:block;font-size:54px;font-weight:700;color:#ffd77a;letter-spacing:-.03em;
  text-shadow:0 0 50px rgba(255,215,122,.5)}
#const-banner span{display:block;margin-top:10px;font-size:15px;color:rgba(235,235,245,.72)}
#const-hint{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:56;font-size:13px;
  color:rgba(255,215,122,.9);pointer-events:none;opacity:0;transition:opacity .4s;text-align:center}
#const-hint.show{opacity:1}
body.drawing #btn-const{background:rgba(255,215,122,.22);border-color:rgba(255,215,122,.6);color:#ffd77a}
@media(max-width:860px){#const-banner b{font-size:34px}#const-badge b{font-size:20px}}
</style>
</head>
<body class="stage-intro">
<script src="vendor/tone/Tone.js"></script>
<canvas id="gl"></canvas>
<div id="emotion" hidden>
  <div class="cam"><video id="video" playsinline muted></video><i class="scan"></i></div>
  <div class="vit">
    <div class="row"><span class="ring" id="e-ring"></span><b id="e-bpm">—</b><small>bpm</small></div>
    <div class="lab" id="e-label">読み取り中…</div>
    <div class="bar"><i id="e-stress"></i></div>
    <div class="src" id="e-src">—</div>
  </div>
</div>

<div id="intro">
  <h1>INNER COSMOS</h1>
  <p>カメラの前に立ってください。<br>音が出ます。</p>
  <button id="start">はじめる</button>
</div>

<div id="weekform">
  <div class="q" id="week-q">今週、何してた？</div>
  <div class="sub">それが、あなたの宇宙になります</div>
  <input id="week-input" type="text" placeholder="例：バイト3回、課題に追われた、友達と1回遊んだ" autocomplete="off" maxlength="120">
  <button id="week-submit">宇宙にする</button>
</div>

<div id="center"></div>
<div id="mode" class="ui">BODY</div>
<div id="hud" class="ui">
  <div class="born"><span id="h-born">0</span> <span style="font-size:12px;color:var(--dim)">stars born</span></div>
  <div class="state" id="h-state">—</div>
  <div>鼓動 <b id="h-hr">—</b> bpm</div>
  <div>緊張 <b id="h-st">—</b></div>
  <div id="h-week">—</div>
  <div id="h-src">—</div>
  <div id="h-real" style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(127,216,255,.25);font-size:11px;line-height:1.5">外の宇宙と接続中…</div>
</div>
<div id="real-badge"></div>
<div id="narration"></div>
<div id="const-badge"></div>
<div id="const-banner"></div>

<div id="controls" class="ui">
  <button id="btn-const">星座を作る</button>
  <button id="btn-mode">内側へ潜る</button>
  <button id="btn-talk">宇宙の声を聴く</button>
</div>

<script type="module">
import * as THREE from './vendor/three/three.module.min.js';
const Tone = window.Tone;

/* ============================================================
   設定（URLパラメータで上書きできる）
   例: ?liface=http://localhost:8000/analyze&llm=http://localhost:11434/api/generate&model=gemma3
   ============================================================ */
const params = new URLSearchParams(location.search);
const CONFIG = {
  LIFACE_URL: params.get('liface') || 'http://localhost:8000/analyze',
  LIFACE_FORMAT: params.get('lifaceFormat') || 'form',   // 'form' = multipart(file) / 'json' = {image: dataURL}
  LIFACE_INTERVAL_MS: 2000,
  LLM_URL: params.get('llm') || 'http://localhost:11434/api/generate', // '/v1/' を含むURLはOpenAI互換として扱う
  LLM_MODEL: params.get('model') || 'gemma3',
  NARRATE_INTERVAL_MS: 15000,
  PARTICLES: 6000,
  SPARKS: 700,
  ENDING_TEXT: '私たちは宇宙を見上げているのではない。<br>私たちの日々が、身体が、宇宙になる。',
  // データ環境（Supabase）。例: ?supaUrl=https://xxxx.supabase.co&supaKey=（anonキー）
  // 未指定なら何も送らない（デモ動作に影響しない）
  SUPABASE_URL: params.get('supaUrl') || '',
  SUPABASE_KEY: params.get('supaKey') || '',
};

/* ============================================================
   「今週、何してた？」→ 宇宙の中身（この作品の核）
   一言の生活が、そのままカテゴリ別の惑星になる
   ============================================================ */
const CATS = {
  work:   { color: 0xffa94d, label: 'バイト・仕事', words: ['バイト','仕事','シフト','派遣','ドンキ','ドン・キホーテ','労働','勤務','出勤'] },
  study:  { color: 0x4dabf7, label: '課題・勉強',   words: ['課題','授業','テスト','レポート','勉強','ゼミ','講義','試験','研究','大学','学校'] },
  social: { color: 0xff6b9d, label: '友達・遊び',   words: ['友達','友人','遊','デート','飲み','パーティ','旅行','出かけ'] },
  rest:   { color: 0x69db7c, label: '休み・睡眠',   words: ['休','寝','睡眠','のんびり','リラックス','だらだら'] },
  other:  { color: 0xced4da, label: 'その他',       words: [] },
};
function guessCategory(text) {
  for (const key of ['work', 'study', 'social', 'rest']) {
    if (CATS[key].words.some((w) => text.includes(w))) return key;
  }
  return 'other';
}
function parseWeek(raw) {
  const parts = raw.split(/[、,。\n・/／]+/).map((s) => s.trim()).filter(Boolean);
  if (!parts.length) return [{ text: raw.trim() || '何もない1週間', category: 'other', weight: 0.5 }];
  return parts.slice(0, 8).map((p) => {
    const m = p.match(/(\d+)\s*(回|個|件|時間|日)/);
    const mult = m ? clamp(parseInt(m[1], 10), 1, 9) : 1;
    return { text: p.slice(0, 16), category: guessCategory(p), weight: clamp(0.4 + mult * 0.16, 0.4, 1.9) };
  });
}

/* ============================================================
   LIFACEのレスポンス → 宇宙の入力
   ★ LIFACE APIの返り値の形が違う場合は、ここだけ書き換える
   ============================================================ */
function mapLiface(j) {
  const pick = (...keys) => {
    for (const k of keys) {
      const v = k.split('.').reduce((o, p) => (o == null ? undefined : o[p]), j);
      if (typeof v === 'number' && isFinite(v)) return v;
    }
    return null;
  };
  return {
    heartRate: pick('heart_rate', 'heartRate', 'bpm', 'hr', 'vitals.heart_rate', 'result.heart_rate'),
    stress:    norm(pick('stress', 'stress_level', 'stressLevel', 'vitals.stress', 'result.stress')),
  };
}
function norm(v) { if (v == null) return null; return v > 1 ? Math.min(v / 100, 1) : Math.max(v, 0); }

/* ============================================================
   状態
   ============================================================ */
const bodyState = { heartRate: 72, stress: 0.25, source: 'DEMO' };
const view = { heartRate: 72, stress: 0.25 };
let activity = 0, bhStrength = 0, stressBoost = 0, aiOnline = false;
let stage = 'intro';          // intro → weekform → prelude → live
let mode = 'SEED';            // SEED(誕生前) / BODY / DIVE / OUT
let ending = false, starsBorn = 0, rotAngle = 0;
let weekItems = [], weekDensity = 0, weekSummary = '';
const MODES = ['BODY', 'DIVE', 'OUT'];
const CAPTIONS = {
  BODY: '動くたびに、今週の出来事が星になっていく。',
  DIVE: '内側へ潜ると、そこにも星の網が広がっている。',
  OUT:  '遠くから見れば、あなたの1週間も一つの星。',
};
const MODE_BUTTON = { BODY: '内側へ潜る', DIVE: '外へ離れる', OUT: '身体へ戻る' };
const $ = (id) => document.getElementById(id);
function setStage(s) { stage = s; document.body.classList.remove('stage-intro', 'stage-prelude', 'stage-live'); document.body.classList.add('stage-' + s); }

/* ============================================================
   Three.js
   ============================================================ */
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 2000);
camera.position.set(0, 0, 12);
const lookAt = new THREE.Vector3();

const VS = `
  attribute float aSize; attribute vec3 aColor;
  uniform float uPulse; uniform float uPixelRatio;
  varying vec3 vColor;
  void main() {
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    gl_Position = projectionMatrix * mv;
    gl_PointSize = min(aSize * uPixelRatio * (1.0 + uPulse * 0.7) * (28.0 / -mv.z), 90.0);
    vColor = aColor;
  }`;
const FS = `
  uniform vec3 uTint; uniform float uTintAmt; uniform float uOpacity; uniform float uPulse;
  varying vec3 vColor;
  void main() {
    float d = length(gl_PointCoord - 0.5);
    float a = smoothstep(0.5, 0.0, d); a *= a;
    vec3 c = mix(vColor, uTint, uTintAmt) * (0.75 + uPulse * 0.9);
    gl_FragColor = vec4(c, a * uOpacity);
  }`;
function pointMaterial(tintAmt = 0.35) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uPulse: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() },
      uTint: { value: new THREE.Color(0.75, 0.9, 1) }, uTintAmt: { value: tintAmt }, uOpacity: { value: 1 },
    },
    vertexShader: VS, fragmentShader: FS, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
}
function pointsFrom(p, c, s, mat) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(p, 3));
  geo.setAttribute('aColor', new THREE.BufferAttribute(c, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(s, 1));
  const pts = new THREE.Points(geo, mat); pts.frustumCulled = false;
  return pts;
}
const g = () => (Math.random() + Math.random() + Math.random() - 1.5);
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
const tmpColor = new THREE.Color();

/* ---------- 身体（=宇宙）の粒子 ---------- */
const N = CONFIG.PARTICLES;
const pos = new Float32Array(N * 3), galaxy = new Float32Array(N * 3), jit = new Float32Array(N * 3);
const seed = new Float32Array(N), col = new Float32Array(N * 3), size = new Float32Array(N);
for (let i = 0; i < N; i++) {
  const arm = i % 3, r = Math.pow(Math.random(), 0.7) * 5.5;
  const a = r * 1.1 + arm * 2.094 + g() * 0.5;
  galaxy[i*3]   = Math.cos(a) * r + g() * 0.25;
  galaxy[i*3+1] = Math.sin(a) * r * 0.55 + g() * 0.25;
  galaxy[i*3+2] = g() * 0.4;
  pos[i*3] = g() * 0.2; pos[i*3+1] = g() * 0.2; pos[i*3+2] = g() * 0.2;
  jit[i*3] = g() * 0.07; jit[i*3+1] = g() * 0.07; jit[i*3+2] = g() * 0.5;
  seed[i] = Math.random();
  const warm = Math.random() < 0.12;
  tmpColor.setHSL(warm ? 0.08 + Math.random() * 0.05 : 0.55 + Math.random() * 0.15, 0.7, 0.55 + Math.random() * 0.25);
  col[i*3] = tmpColor.r; col[i*3+1] = tmpColor.g; col[i*3+2] = tmpColor.b;
  size[i] = Math.random() < 0.02 ? 5 + Math.random() * 3 : 0.8 + Math.random() * 2.2;
}
const bodyMat = pointMaterial();
const bodyPoints = pointsFrom(pos, col, size, bodyMat);
const bodyGeo = bodyPoints.geometry;
scene.add(bodyPoints);

/* ---------- 身体の中のシナプス（近い粒子同士の線） ---------- */
const MAXSEG = 700;
const linePos = new Float32Array(MAXSEG * 6);
const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(linePos, 3));
const lineMat = new THREE.LineBasicMaterial({ color: 0x7cc4ff, transparent: true, opacity: 0.1,
  blending: THREE.AdditiveBlending, depthWrite: false });
const lines = new THREE.LineSegments(lineGeo, lineMat); lines.frustumCulled = false;
scene.add(lines);

/* ---------- 動きから生まれる星（この作品の核） ---------- */
const S = CONFIG.SPARKS;
const sPos = new Float32Array(S * 3), sVel = new Float32Array(S * 3), sBase = new Float32Array(S * 3);
const sCol = new Float32Array(S * 3), sSize = new Float32Array(S), sBaseSize = new Float32Array(S);
const sAge = new Float32Array(S), sLife = new Float32Array(S), sFade = new Float32Array(S);
const sGen = new Uint32Array(S), sAlive = new Uint8Array(S);
let sHead = 0, lastSpark = -1, lastSparkTime = -10, genCounter = 1;
const sparkMat = pointMaterial(0);
const sparkPoints = pointsFrom(sPos, sCol, sSize, sparkMat);
const sparkGeo = sparkPoints.geometry;
scene.add(sparkPoints);

/* 星同士をつなぐ星座の線 */
const L = 900;
const lA = new Int32Array(L), lB = new Int32Array(L), lGA = new Uint32Array(L), lGB = new Uint32Array(L);
let lHead = 0;
const linkPos = new Float32Array(L * 6), linkCol = new Float32Array(L * 6);
const linkGeo = new THREE.BufferGeometry();
linkGeo.setAttribute('position', new THREE.BufferAttribute(linkPos, 3));
linkGeo.setAttribute('color', new THREE.BufferAttribute(linkCol, 3));
const linkLines = new THREE.LineSegments(linkGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true,
  opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false }));
linkLines.frustumCulled = false;
scene.add(linkLines);

function addLink(a, b) {
  const k = lHead; lHead = (lHead + 1) % L;
  lA[k] = a; lB[k] = b; lGA[k] = sGen[a]; lGB[k] = sGen[b];
}
function d2s(a, b) {
  const dx = sPos[a*3] - sPos[b*3], dy = sPos[a*3+1] - sPos[b*3+1], dz = sPos[a*3+2] - sPos[b*3+2];
  return dx*dx + dy*dy + dz*dz;
}
const PERM = 64;                 // 実観測イベント由来の星のための予約枠
const RING = S - PERM;           // 通常の星が回るリングバッファ
let permHead = 0;
function spawnSpark(x, y, z, strength, vx = 0, vy = 0, permanent = false, hue = null) {
  const i = permanent ? RING + (permHead++ % PERM) : sHead;
  if (!permanent) sHead = (sHead + 1) % RING;
  // 実観測の星は消えない。現実に起きた記録なので、寿命を持たせない。
  sAlive[i] = 1; sGen[i] = genCounter++; sAge[i] = 0; sLife[i] = permanent ? Infinity : 10 + Math.random() * 6;
  sPos[i*3] = x; sPos[i*3+1] = y; sPos[i*3+2] = z;
  sVel[i*3] = vx + g() * 0.35; sVel[i*3+1] = vy + g() * 0.35; sVel[i*3+2] = g() * 0.2;
  // 実観測の星は色相を固定し、通常の星と混ざらないようにする
  const h = hue != null ? hue
    : view.stress > 0.6 ? 0.9 + Math.random() * 0.08
    : 0.5 + clamp(y / 10 + 0.5, 0, 1) * 0.2 + Math.random() * 0.04;
  tmpColor.setHSL(h % 1, hue != null ? 1.0 : 0.85, hue != null ? 0.72 : 0.6 + Math.random() * 0.2);
  sBase[i*3] = tmpColor.r; sBase[i*3+1] = tmpColor.g; sBase[i*3+2] = tmpColor.b;
  // 実観測の星は明確に大きい。指で指せることが、この作品の核の前提。
  sBaseSize[i] = permanent ? 16 + strength * 6 : 3 + strength * 5 + Math.random() * 2;
  // 星座：直前に生まれた星と、近くの星につなぐ
  if (lastSpark >= 0 && sAlive[lastSpark] && time - lastSparkTime < 0.4 && d2s(i, lastSpark) < 2.5) addLink(i, lastSpark);
  let best = -1, bd = 1.4;
  for (let k = 2; k < 40; k++) {
    const j = (i - k + S) % S;
    if (!sAlive[j]) continue;
    const d = d2s(i, j);
    if (d < bd) { bd = d; best = j; }
  }
  if (best >= 0 && !conste.on && Math.random() < 0.55) addLink(i, best);
  lastSpark = i; lastSparkTime = time; starsBorn++;
  sparkNote(x, y, strength);
}
function clearSparks() {
  // 実観測由来（予約枠）の星は残す。現実に起きた記録は週を作り直しても消さない。
  for (let i = 0; i < RING; i++) { sAlive[i] = 0; sSize[i] = 0; sCol[i*3] = sCol[i*3+1] = sCol[i*3+2] = 0; }
  lGA.fill(0); lastSpark = -1; starsBorn = 0;
}

function updateSparks(dt) {
  const damp = Math.exp(-dt * 1.2), glow = ending ? 1.7 : 1;
  for (let i = 0; i < S; i++) {
    if (!sAlive[i]) continue;
    const i3 = i * 3;
    const age = (sAge[i] += dt), life = sLife[i];
    if (age > life) { sAlive[i] = 0; sSize[i] = 0; sCol[i3] = sCol[i3+1] = sCol[i3+2] = 0; continue; }
    let vx = sVel[i3] * damp, vy = sVel[i3+1] * damp, vz = sVel[i3+2] * damp;
    if (age > 2.5) { // 生まれた星は、やがて宇宙の渦に加わっていく
      const pull = Math.min((age - 2.5) * 0.05, 0.3), x = sPos[i3], y = sPos[i3+1];
      vx += (-y * 0.3 - x * 0.1) * pull * dt * 4;
      vy += ( x * 0.3 - y * 0.1) * pull * dt * 4;
    }
    sVel[i3] = vx; sVel[i3+1] = vy; sVel[i3+2] = vz;
    sPos[i3] += vx * dt; sPos[i3+1] += vy * dt; sPos[i3+2] += vz * dt;
    const fade = Math.min(age * 6, 1) * Math.min((life - age) / 3, 1);
    sFade[i] = fade;
    const f = fade * glow;
    sCol[i3] = sBase[i3] * f; sCol[i3+1] = sBase[i3+1] * f; sCol[i3+2] = sBase[i3+2] * f;
    sSize[i] = sBaseSize[i] * (1 + 2.5 * Math.exp(-age * 5)) * (0.6 + fade * 0.4);
    // 実観測の星は、ゆっくり脈打つ。他の何百個と見分けるための唯一の手がかり。
    if (i >= RING) sSize[i] = sBaseSize[i] * (1.0 + 0.45 * Math.sin(age * 1.7 + i));
  }
  sparkGeo.attributes.position.needsUpdate = true;
  sparkGeo.attributes.aColor.needsUpdate = true;
  sparkGeo.attributes.aSize.needsUpdate = true;

  let n = 0;
  for (let k = 0; k < L; k++) {
    if (!lGA[k]) continue;
    const a = lA[k], b = lB[k];
    if (!sAlive[a] || !sAlive[b] || sGen[a] !== lGA[k] || sGen[b] !== lGB[k]) { lGA[k] = 0; continue; }
    const f = Math.min(sFade[a], sFade[b]) * 0.55 * glow, o = n * 6;
    linkPos[o] = sPos[a*3]; linkPos[o+1] = sPos[a*3+1]; linkPos[o+2] = sPos[a*3+2];
    linkPos[o+3] = sPos[b*3]; linkPos[o+4] = sPos[b*3+1]; linkPos[o+5] = sPos[b*3+2];
    for (let c = 0; c < 3; c++) { linkCol[o+c] = sBase[a*3+c] * f; linkCol[o+3+c] = sBase[b*3+c] * f; }
    n++;
  }
  linkGeo.setDrawRange(0, n * 2);
  linkGeo.attributes.position.needsUpdate = true;
  linkGeo.attributes.color.needsUpdate = true;
}


/* ============================================================
   星座を作る（体の動きで描き、止めると完成する）
   既存の spark / link とは別のバッファ。世代照合で消えることがない。
   ============================================================ */
const CN = 140;                       // 星座の節点の上限
const CE = 220;                       // 辺の上限
const DOTS = 11;                      // 1本の辺を何個の光の粒で描くか（1pxの線は後席から見えないため）
const cPos = new Float32Array(CN * 3), cCol = new Float32Array(CN * 3), cSize = new Float32Array(CN);
let cCount = 0;
const cMat = pointMaterial(0);
const cPoints = pointsFrom(cPos, cCol, cSize, cMat);
const cGeo = cPoints.geometry;
cPoints.frustumCulled = false;
scene.add(cPoints);

const ePos = new Float32Array(CE * DOTS * 3), eCol = new Float32Array(CE * DOTS * 3), eSize = new Float32Array(CE * DOTS);
let eCount = 0;                        // 使用中の辺の数
const eMat = pointMaterial(0);
const ePoints = pointsFrom(ePos, eCol, eSize, eMat);
const eGeo = ePoints.geometry;
ePoints.frustumCulled = false;
scene.add(ePoints);

const NODE_HUE = 0.13;                 // 金色。動きから生まれる星（青〜紫）と混ざらない
const tmpC2 = new THREE.Color();

const conste = {
  on: false,            // 作図モード中か
  nodes: [],            // いま描いている星座の節点 index
  last: null,           // 直前の節点座標
  idle: 0,              // 節点を置いていない時間
  done: [],             // 完成した星座 [{name, ts, nodes:[[x,y,z]], edges:[[i,j]]}]
  flash: 0,             // 完成演出の残り時間
  cursor: new THREE.Vector3(),
  cursorOk: false,
};
const CONST_KEY = 'inner-cosmos:constellations';
const STEP = 1.15;      // これだけ離れたら次の節点を置く（静止判定を使わないための距離ゲート）
const CLOSE_IDLE = 1.5; // 手が止まってからこの秒数で完成
const NEED = 3;         // 最低3点で星座
const GOAL = 3;         // いくつ作れば宇宙が完成するか

function addNode(x, y, z) {
  if (cCount >= CN) return -1;
  const i = cCount++;
  cPos[i*3] = x; cPos[i*3+1] = y; cPos[i*3+2] = z;
  tmpC2.setHSL(NODE_HUE, 0.95, 0.72);
  cCol[i*3] = tmpC2.r; cCol[i*3+1] = tmpC2.g; cCol[i*3+2] = tmpC2.b;
  cSize[i] = 22;
  cGeo.attributes.position.needsUpdate = true;
  cGeo.attributes.aColor.needsUpdate = true;
  cGeo.attributes.aSize.needsUpdate = true;
  cGeo.setDrawRange(0, cCount);
  return i;
}

// 辺を「光の粒の数珠」として焼く。線ではないので太さが出て、後席からでも読める。
function bakeEdge(ax, ay, az, bx, by, bz) {
  if (eCount >= CE) return;
  const e = eCount++;
  for (let k = 0; k < DOTS; k++) {
    const t = (k + 0.5) / DOTS, o = (e * DOTS + k) * 3;
    ePos[o] = ax + (bx - ax) * t; ePos[o+1] = ay + (by - ay) * t; ePos[o+2] = az + (bz - az) * t;
    tmpC2.setHSL(NODE_HUE, 0.9, 0.62);
    eCol[o] = tmpC2.r; eCol[o+1] = tmpC2.g; eCol[o+2] = tmpC2.b;
    eSize[e * DOTS + k] = 8;
  }
  eGeo.attributes.position.needsUpdate = true;
  eGeo.attributes.aColor.needsUpdate = true;
  eGeo.attributes.aSize.needsUpdate = true;
  eGeo.setDrawRange(0, eCount * DOTS);
}

// 動き／指の位置から節点を置く。止まっているかではなく、前の点から離れたかで判定する。
function feedConstellation(x, y, z) {
  if (!conste.on || stage !== 'live' || ending) return;
  conste.cursor.set(x, y, z); conste.cursorOk = true;
  const L2 = conste.last;
  if (L2) {
    const dx = x - L2[0], dy = y - L2[1], dz = z - L2[2];
    if (dx*dx + dy*dy + dz*dz < STEP * STEP) return;
  }
  const i = addNode(x, y, z);
  if (i < 0) return;
  if (L2) bakeEdge(L2[0], L2[1], L2[2], x, y, z);
  conste.nodes.push(i);
  conste.last = [x, y, z];
  conste.idle = 0;
  try { sparkNote(x, y, 0.9); } catch (e) {}
  showConsteHint();
}

const CONST_WORDS_A = ['ひかりの', 'しずかな', 'とおい', 'めぐる', 'はじまりの', 'ちいさな', 'ゆれる', 'のこされた'];
const CONST_WORDS_B = ['てのひら座', 'まわり道座', 'ねむり座', 'よあけ座', 'あしあと座', 'こだま座', 'かけら座', 'いきどまり座'];
function makeName(n) {
  const a = CONST_WORDS_A[(cCount * 7 + n) % CONST_WORDS_A.length];
  const b = CONST_WORDS_B[(conste.done.length * 3 + n) % CONST_WORDS_B.length];
  return a + b;
}

function finishConstellation() {
  const n = conste.nodes.length;
  if (n < NEED) { conste.nodes = []; conste.last = null; return; }
  const now = new Date();
  const rec = {
    name: makeName(n),
    ts: `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`,
    nodes: conste.nodes.map((i) => [cPos[i*3], cPos[i*3+1], cPos[i*3+2]]),
  };
  conste.done.push(rec);
  saveConstellations();
  conste.nodes = []; conste.last = null; conste.idle = 0;
  conste.flash = 1.4;                       // この間だけ他を暗くして、完成を見えるようにする
  showConsteBanner(rec);
  try { chord(); } catch (e) {}
  if (conste.done.length >= GOAL && !universeDone) completeUniverse();
}

function saveConstellations() {
  try { localStorage.setItem(CONST_KEY, JSON.stringify(conste.done.slice(-12))); } catch (e) {}
}
function restoreConstellations() {
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem(CONST_KEY) || '[]'); } catch (e) { return; }
  if (!Array.isArray(saved)) return;
  for (const r of saved.slice(-12)) {
    if (!r || !Array.isArray(r.nodes) || r.nodes.length < 2) continue;
    const idx = r.nodes.map((q) => addNode(q[0], q[1], q[2]));
    for (let k = 1; k < r.nodes.length; k++) {
      const a = r.nodes[k-1], b = r.nodes[k];
      bakeEdge(a[0], a[1], a[2], b[0], b[1], b[2]);
    }
    conste.done.push(r);
  }
  updateConsteBadge();
}

function toggleConstellation(on) {
  conste.on = on === undefined ? !conste.on : on;
  if (!conste.on) { finishConstellation(); }
  conste.idle = 0;
  document.body.classList.toggle('drawing', conste.on);
  const b = $('btn-const');
  if (b) b.textContent = conste.on ? '星座を作っている…' : '星座を作る';
  showConsteHint();
}

function updateConsteBadge() {
  const b = $('const-badge');
  if (!b) return;
  const n = conste.done.length;
  if (!n && !conste.on) { b.innerHTML = ''; return; }
  const list = conste.done.slice(-3).reverse().map((r) => `${r.name}`).join('<br>');
  b.innerHTML = `<b>${n} / ${GOAL}</b>星座<div class="list">${list}</div>`;
}
function showConsteBanner(rec) {
  const el = $('const-banner');
  if (!el) return;
  el.innerHTML = `<b>${rec.name}</b><span>星 ${rec.nodes.length} 個でできた、あなたの星座</span>`;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2600);
  updateConsteBadge();
}
function showConsteHint() {
  const el = $('const-hint');
  if (!el) return;
  if (!conste.on) { el.classList.remove('show'); return; }
  const n = conste.nodes.length;
  el.textContent = n === 0 ? '手を動かすと、星が置かれます'
    : n < NEED ? `あと ${NEED - n} 個 置くと星座になります`
    : '手を止めると、星座が完成します';
  el.classList.add('show');
}

function updateConstellation(dt) {
  if (conste.flash > 0) conste.flash = Math.max(0, conste.flash - dt);
  if (!conste.on) return;
  if (conste.nodes.length) {
    conste.idle += dt;
    if (conste.idle > CLOSE_IDLE) finishConstellation();
    else if (frame % 20 === 0) showConsteHint();
  }
}


/* ============================================================
   宇宙の完成 → ビッグバン
   星座をGOAL個つくると宇宙が完成し、いったん一点に収縮して爆発する。
   爆発後、作った星座ひとつひとつが、新しい銀河の種になって配置される。
   既存のバッファだけを使い、新しい確保はしない（低スペック端末対策）。
   ============================================================ */
let universeDone = false;
const bang = { on: false, t: 0, seeds: [], saved: null };
const BANG = { collapse: 3.0, hold: 1.0, burst: 0.5, spread: 5.5, settle: 3.0 };
const BANG_TOTAL = BANG.collapse + BANG.hold + BANG.burst + BANG.spread + BANG.settle;

function completeUniverse() {
  if (universeDone || bang.on) return;
  universeDone = true;
  bigBangFinale();
}

function bigBangFinale() {
  if (bang.on) return;
  bang.on = true; bang.t = 0;
  // 作った星座の重心を、新しい銀河の種にする
  bang.seeds = conste.done.map((r, i) => {
    const n = r.nodes.length || 1;
    let x = 0, y = 0;
    for (const q of r.nodes) { x += q[0]; y += q[1]; }
    const a = (i / Math.max(1, conste.done.length)) * Math.PI * 2;
    return { name: r.name, cx: x / n, cy: y / n, ang: a, r: 9 + i * 2.2 };
  });
  // 節点の元の位置を覚えておく（収縮して戻すため）
  bang.saved = new Float32Array(cPos.subarray(0, cCount * 3));
  showBangText('宇宙が、完成した。', '');
  try {
    if (audio.drone) audio.drone.volume.rampTo(-8, BANG.collapse);
    if (audio.bell) audio.bell.triggerAttackRelease('C2', '1n', Tone.now(), 0.5);
  } catch (e) {}
}

function showBangText(main, sub) {
  const el = $('const-banner');
  if (!el) return;
  el.innerHTML = `<b>${main}</b>${sub ? `<span>${sub}</span>` : ''}`;
  el.classList.add('show');
}
function hideBangText() { $('const-banner')?.classList.remove('show'); }

function updateBang(dt) {
  if (!bang.on) return;
  const prev = bang.t;
  bang.t += dt;
  const t = bang.t;
  const P = BANG;
  const e1 = P.collapse, e2 = e1 + P.hold, e3 = e2 + P.burst, e4 = e3 + P.spread;

  if (t < e1) {
    // 収縮：すべてが一点へ吸い込まれていく
    const u = t / e1, pull = u * u;
    for (let i = 0; i < cCount; i++) {
      const o = i * 3;
      cPos[o] = bang.saved[o] * (1 - pull); cPos[o+1] = bang.saved[o+1] * (1 - pull); cPos[o+2] = bang.saved[o+2] * (1 - pull);
      cSize[i] = 22 * (1 - pull * 0.75);
    }
    collapseEdges(pull);
    if (prev < 1.2 && t >= 1.2) showBangText('宇宙が、完成した。', 'すべてが、一点に戻っていく');
  } else if (t < e2) {
    // 特異点：無音の一拍
    for (let i = 0; i < cCount; i++) { const o = i * 3; cPos[o] = cPos[o+1] = cPos[o+2] = 0; cSize[i] = 6; }
    collapseEdges(1);
    if (prev < e1 + 0.05) { hideBangText(); try { audio.drone?.volume.rampTo(-60, 0.3); } catch (e) {} }
  } else if (t < e3) {
    // 爆発
    if (prev < e2 + 0.05) {
      showBangText('ビッグバン', '');
      try { kickNow(); audio.drone?.volume.rampTo(-24, 0.4); } catch (e) {}
    }
    const u = (t - e2) / P.burst;
    for (let i = 0; i < cCount; i++) cSize[i] = 6 + u * 46;
  } else if (t < e4) {
    // 展開：星座ひとつひとつが、新しい銀河の種として配置されていく
    const u = (t - e3) / P.spread, ease = 1 - Math.pow(1 - u, 3);
    let idx = 0;
    for (let k = 0; k < conste.done.length; k++) {
      const seed = bang.seeds[k], rec = conste.done[k];
      if (!seed || !rec) continue;
      const bx = Math.cos(seed.ang) * seed.r, by = Math.sin(seed.ang) * seed.r * 0.55;
      for (let q = 0; q < rec.nodes.length && idx < cCount; q++, idx++) {
        const o = idx * 3, src = rec.nodes[q];
        const tx = bx + (src[0] - seed.cx) * 0.55, ty = by + (src[1] - seed.cy) * 0.55;
        cPos[o] = tx * ease; cPos[o+1] = ty * ease; cPos[o+2] = (src[2] || 0) * ease;
        cSize[idx] = 52 - ease * 30;
      }
      if (prev < e3 + 0.4 + k * 0.7 && t >= e3 + 0.4 + k * 0.7) {
        showBangText(rec.name, 'が、銀河になった');
        try { audio.bell?.triggerAttackRelease(['C4','E4','G4','B4','D5'][k % 5], '2n', undefined, 0.4); } catch (e) {}
      }
    }
    rebuildEdgesFromDone(ease);
  } else if (t < e4 + P.settle) {
    if (prev < e4 + 0.05) showBangText('あなたの宇宙が、はじまった。', '星座は、銀河になって残ります');
  } else {
    // 終了状態をはっきり決める：新しい配置のまま留まり、通常運転に戻る
    bang.on = false;
    hideBangText();
    try { audio.drone?.volume.rampTo(-38, 1.2); } catch (e) {}
    updateConsteBadge();
  }
  cGeo.attributes.position.needsUpdate = true;
  cGeo.attributes.aSize.needsUpdate = true;
}

function collapseEdges(pull) {
  for (let k = 0; k < eCount * DOTS; k++) {
    const o = k * 3;
    ePos[o] *= (1 - pull * 0.12); ePos[o+1] *= (1 - pull * 0.12); ePos[o+2] *= (1 - pull * 0.12);
    eSize[k] = 8 * (1 - pull);
  }
  eGeo.attributes.position.needsUpdate = true;
  eGeo.attributes.aSize.needsUpdate = true;
}

function rebuildEdgesFromDone(ease) {
  let e = 0;
  let idx = 0;
  for (let k = 0; k < conste.done.length; k++) {
    const rec = conste.done[k];
    const start = idx;
    idx += rec.nodes.length;
    for (let q = start + 1; q < idx && q < cCount && e < CE; q++, e++) {
      const a = (q - 1) * 3, b = q * 3;
      for (let d = 0; d < DOTS; d++) {
        const tt = (d + 0.5) / DOTS, o = (e * DOTS + d) * 3;
        ePos[o] = cPos[a] + (cPos[b] - cPos[a]) * tt;
        ePos[o+1] = cPos[a+1] + (cPos[b+1] - cPos[a+1]) * tt;
        ePos[o+2] = cPos[a+2] + (cPos[b+2] - cPos[a+2]) * tt;
        eSize[e * DOTS + d] = 8 * ease;
      }
    }
  }
  eCount = Math.max(eCount, e);
  eGeo.setDrawRange(0, eCount * DOTS);
  eGeo.attributes.position.needsUpdate = true;
  eGeo.attributes.aSize.needsUpdate = true;
}

function kickNow() {
  const t = Tone.now();
  audio.kick?.triggerAttackRelease('A0', '8n', t, 1);
  audio.kick?.triggerAttackRelease('E1', '8n', t + 0.12, 0.7);
}

/* ---------- 宇宙の大規模構造（コズミックウェブ） ---------- */
function buildWeb() {
  const nodes = [];
  for (let i = 0; i < 60; i++) nodes.push(new THREE.Vector3(g(), g(), g()).normalize().multiplyScalar(Math.cbrt(Math.random()) * 50));
  const edges = [];
  nodes.forEach((n, i) => {
    nodes.map((m, j) => [j, n.distanceToSquared(m)]).filter(([j]) => j !== i)
      .sort((a, b) => a[1] - b[1]).slice(0, 3).forEach(([j]) => edges.push([i, j]));
  });
  const M = 9000, p = new Float32Array(M * 3), c = new Float32Array(M * 3), s = new Float32Array(M);
  const v = new THREE.Vector3();
  for (let i = 0; i < M; i++) {
    if (Math.random() < 0.3) {
      v.copy(nodes[Math.floor(Math.random() * nodes.length)]).add(new THREE.Vector3(g(), g(), g()).multiplyScalar(2.2));
    } else {
      const [a, b] = edges[Math.floor(Math.random() * edges.length)];

    const i3 = i * 3;
    let tx, ty, tz;
    if (mode === 'SEED') { tx = jit[i3] * 2; ty = jit[i3+1] * 2; tz = jit[i3+2] * 0.2; }
    else if (mode === 'OUT') { tx = jit[i3] * 3; ty = jit[i3+1] * 3; tz = jit[i3+2] * 0.4; }
    else if (body) {
      const s = Math.floor(seed[i] * silCount) * 2;
      tx = silBuf[s] + jit[i3]; ty = silBuf[s+1] + jit[i3+1]; tz = jit[i3+2];
    } else {
      const gx = galaxy[i3], gy = galaxy[i3+1];
      tx = gx * ca - gy * sa; ty = gx * sa + gy * ca; tz = galaxy[i3+2];
    }
    let px = pos[i3] + (tx - pos[i3]) * k + g() * tremble;
    let py = pos[i3+1] + (ty - pos[i3+1]) * k + g() * tremble;
    let pz = pos[i3+2] + (tz - pos[i3+2]) * k;
    if (bhStrength > 0.02 && mode !== 'OUT' && mode !== 'SEED') {
      const dx = c.x - px, dy = c.y - py, d2 = dx * dx + dy * dy;
      if (d2 < 12) { const f = bhStrength * 0.035 / (d2 + 0.4); px += dx * f - dy * f * 0.8; py += dy * f + dx * f * 0.8; }
    }
    pos[i3] = px; pos[i3+1] = py; pos[i3+2] = pz;
  }
  bodyGeo.attributes.position.needsUpdate = true;
}

function updateLines() {
  if (mode === 'OUT' || mode === 'SEED') { lineGeo.setDrawRange(0, 0); return; }
  let s = 0; const th2 = 0.09, step = Math.floor(N / 650);
  for (let a = 0; a < N && s < MAXSEG; a += step) {
    const ax = pos[a*3], ay = pos[a*3+1], az = pos[a*3+2];
    for (let b = a + step; b < N && s < MAXSEG; b += step) {
      const dx = pos[b*3] - ax, dy = pos[b*3+1] - ay, dz = pos[b*3+2] - az;
      if (dx*dx + dy*dy + dz*dz < th2) {
        const o = s * 6;
        linePos[o] = ax; linePos[o+1] = ay; linePos[o+2] = az;
        linePos[o+3] = pos[b*3]; linePos[o+4] = pos[b*3+1]; linePos[o+5] = pos[b*3+2];
        s++;
      }
    }
  }
  lineGeo.setDrawRange(0, s * 2);
  lineGeo.attributes.position.needsUpdate = true;
}

const camGoal = new THREE.Vector3(), lookGoal = new THREE.Vector3(), webGoal = new THREE.Vector3();
function updateScene(dt, pulse) {
  const c = chest(), k = 1 - Math.exp(-dt * 1.3);
  let bodyOp = 1, webOp = 0, webScale = 0.07, sparkOp = 1;
  camGoal.set(0, 0, 12); lookGoal.set(0, 0, 0); webGoal.set(0, 0, 0);
  if (mode === 'SEED') { bodyOp = 0.9; }
  if (mode === 'DIVE') {
    camGoal.set(c.x, c.y, 2.4); lookGoal.set(c.x, c.y, 0); webGoal.set(c.x, c.y, 0);
    bodyOp = 0.12; webOp = 1; sparkOp = 0.5;
  }
  if (mode === 'OUT') { camGoal.set(0, 0, 95); webOp = 1; webScale = 1; sparkOp = 0.25; }
  if (ending) bodyOp = Math.min(bodyOp, 0.35);
  camera.position.lerp(camGoal, k); lookAt.lerp(lookGoal, k); camera.lookAt(lookAt);
  webGroup.position.lerp(webGoal, k);
  webGroup.scale.setScalar(webGroup.scale.x + (webScale - webGroup.scale.x) * k);
  webGroup.rotation.y += dt * 0.02;
  // 星座が完成した瞬間だけ、他を暗く落として、できた形を見えるようにする
  const dimAmt = conste.flash > 0 ? 0.22 + 0.78 * (1 - Math.min(conste.flash / 1.4, 1)) : 1;
  cMat.uniforms.uOpacity.value = 1;
  eMat.uniforms.uOpacity.value = 1;
  const wm = web.material.uniforms, bm = bodyMat.uniforms, sm = sparkMat.uniforms;
  wm.uOpacity.value += (webOp * dimAmt - wm.uOpacity.value) * k;
  bm.uOpacity.value += (bodyOp * dimAmt - bm.uOpacity.value) * k;
  sm.uOpacity.value += (sparkOp * dimAmt - sm.uOpacity.value) * k;
  bm.uPulse.value = mode === 'SEED' ? pulse * 1.6 : pulse; wm.uPulse.value = pulse * 0.4; sm.uPulse.value = pulse * 0.3;
  lineMat.opacity = (0.04 + activity * 0.3 + pulse * 0.06) * bm.uOpacity.value;

  const bhTarget = (mode === 'OUT' || mode === 'SEED') ? 0 : clamp((view.stress - 0.65) / 0.25, 0, 1);
  bhStrength += (bhTarget - bhStrength) * (1 - Math.exp(-dt * 0.8));
  bh.position.set(c.x, c.y, 0.2);
  bh.scale.setScalar(Math.max(bhStrength * 1.3, 0.001) * (1 + pulse * 0.05));
  bhRing.rotation.z += dt * 0.8;
}

// 鼓動と緊張から、いまの状態を言葉にする。診断ではなく、宇宙への入力としての表現。
function emotionWord(hr, st, act) {
  if (st > 0.72) return ['はりつめている', '#ff6b7a'];
  if (st > 0.5)  return ['気が張っている', '#ffa04a'];
  if (act > 0.45) return ['高ぶっている', '#ffd05a'];
  if (hr > 92)   return ['息が上がっている', '#ffd05a'];
  if (st < 0.22 && act < 0.15) return ['しずかにしている', '#7fd8ff'];
  return ['おだやか', '#9fe8b0'];
}

let lastBeatMs = 0;
function updateEmotion() {
  const el = $('emotion');
  if (!el) return;
  if (stage !== 'live') { el.hidden = true; return; }
  el.hidden = false;
  const hr = Math.round(view.heartRate), st = view.stress;
  const [word, color] = emotionWord(hr, st, activity);
  $('e-bpm').textContent = hr;
  $('e-stress').style.width = Math.round(st * 100) + '%';
  const lab = $('e-label');
  lab.textContent = word; lab.style.color = color;
  const ring = $('e-ring');
  // 拍動を実際の心拍数に合わせる
  const beatMs = Math.round(60000 / Math.max(40, Math.min(180, hr)));
  if (beatMs !== lastBeatMs) { ring.style.animationDuration = beatMs + 'ms'; lastBeatMs = beatMs; }
  ring.style.background = color; ring.style.boxShadow = '0 0 12px ' + color;
  const cam = el.querySelector('.cam');
  cam.style.display = videoReady ? '' : 'none';
  $('e-src').textContent = videoReady
    ? `カメラ ／ ${bodyState.source === 'LIFACE' ? '表情から推定（ローカル）' : 'デモ値'}`
    : 'カメラなし ／ デモ値';
}

function updateHud() {
  const state = bhStrength > 0.3 ? 'ブラックホール発生' : view.stress > 0.5 ? '過密' : activity > 0.25 ? '活発' : '安定';
  $('h-born').textContent = starsBorn;
  $('h-state').textContent = state;
  $('h-hr').textContent = Math.round(view.heartRate);
  $('h-st').textContent = Math.round(view.stress * 100);
  const bodySrc = bodyState.source === 'LIFACE' ? 'LIFACE' : 'デモ';
  const eye = videoReady ? (segmenter ? 'カメラ' : 'カメラ(動きのみ)') : 'タッチ';
  $('h-src').textContent = `入力: ${eye} ／ 身体: ${bodySrc} ／ 声: ${aiOnline ? 'ローカルAI' : '定型文'}`;
  $('mode').textContent = mode === 'SEED' ? '' : mode;
  updateEmotion();
}

let last = performance.now(), frame = 0, time = 0, fps = 60;
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min((now - last) / 1000, 0.05); last = now; time += dt; frame++;
  fps += ((dt > 0 ? 1 / dt : 60) - fps) * 0.05;
  const moved = detectMotion(now);
  runSeg(now);
  if (stage === 'live' && !ending) {
    if (videoReady && motionPrimed) { if (moved) spawnFromMotion(0.033); }
    else if (time - lastPointerTime > 4) ghostHand(dt);
  }
  if (!videoReady && time - lastPointerTime > 1) activity += (0 - activity) * 0.02;
  if (bodyState.source === 'DEMO') demoVitals(time);
  const k = 1 - Math.exp(-dt * 1.2);
  view.heartRate += (bodyState.heartRate - view.heartRate) * k;
  view.stress += (Math.min(bodyState.stress + stressBoost + weekDensity * 0.8, 1) - view.stress) * k;
  const pulse = heartbeat(dt);
  updateBody(dt);
  updateSparks(dt);
  updateWeek(dt);
  updateConstellation(dt);
  updateBang(dt);
  if (frame % 3 === 0) updateLines();
  updateScene(dt, pulse);
  music(time);
  if (frame % 10 === 0) updateHud();
  renderer.render(scene, camera);
}
requestAnimationFrame(tick);

/* ============================================================
   導入：心音 → 問い → 誕生
   ============================================================ */
let skipPrelude = false;
const wait = (ms) => new Promise((r) => { const t0 = performance.now(); const f = () => (skipPrelude || performance.now() - t0 >= ms) ? r() : setTimeout(f, 50); f(); });
function bigBang() {
  for (let i = 0; i < 48; i++) {
    const a = (i / 48) * Math.PI * 2, sp = 2.5 + Math.random() * 2;
    spawnSpark(0, 0, g() * 0.2, 1, Math.cos(a) * sp, Math.sin(a) * sp);
  }
  starsBorn = 0;
}
let hasIntroed = false;
async function runPrelude(items) {
  skipPrelude = false;
  setStage('prelude'); mode = 'SEED';
  applyWeek(items);
  if (!hasIntroed) {
    await wait(2400);
    showCenter('宇宙は、どこにあるのだろう。');
    await wait(3400);
    hideCenter(); await wait(700);
  }
  showCenter(weekSummary ? `——あなたの1週間。<br><span style="font-size:.72em;color:var(--dim)">${weekSummary}</span>` : '——ここに。', true);
  await wait(2600);
  hideCenter();
  setStage('live'); mode = 'BODY';
  bigBang();
  showNarration(CAPTIONS.BODY);
  hasIntroed = true;
  setTimeout(narrate, 6000);
  if (!narrateTimer) narrateTimer = setInterval(narrate, CONFIG.NARRATE_INTERVAL_MS);
}
let narrateTimer = null;

/* ---------- 「今週、何してた？」入力フォーム ---------- */
const weekForm = $('weekform'), weekInput = $('week-input');
function showWeekForm() {
  setStage('prelude');
  weekForm.style.display = 'flex'; weekForm.style.opacity = 1;
  $('week-q').textContent = hasIntroed ? '次は、あなたの番です。今週、何してた？' : '今週、何してた？';
  weekInput.value = '';
  setTimeout(() => weekInput.focus(), 50);
}
function hideWeekForm() {
  weekForm.style.opacity = 0;
  setTimeout(() => (weekForm.style.display = 'none'), 800);
}
function submitWeek() {
  const raw = weekInput.value.trim();
  if (!raw) { weekInput.focus(); return; }
  hideWeekForm();
  runPrelude(parseWeek(raw));
}
$('week-submit').onclick = submitWeek;
weekInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submitWeek(); } });

/* ============================================================
   操作
   ============================================================ */
function nextMode() {
  if (stage !== 'live') return;
  mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length];
  $('btn-mode').textContent = MODE_BUTTON[mode];
  showNarration(CAPTIONS[mode]);
}
function toggleEnding() {
  if (stage !== 'live') return;
  ending = !ending;
  if (ending) { narrationEl.style.opacity = 0; showCenter(CONFIG.ENDING_TEXT, true); document.body.classList.add('hide-hud'); }
  else { hideCenter(); document.body.classList.remove('hide-hud'); }
}
function startNewWeek() {
  if (stage !== 'live') return;
  clearSparks(); ending = false; stressBoost = 0; hideCenter(); document.body.classList.remove('hide-hud');
  mode = 'BODY'; $('btn-mode').textContent = MODE_BUTTON.BODY;
  showWeekForm();   // 次の人（審査員）の1週間を聞く
}
$('btn-mode').onclick = nextMode;
$('btn-talk').onclick = narrate;
addEventListener('keydown', (e) => {
  if (document.activeElement === weekInput) return;   // 入力中はショートカットを無効化（EnterはweekInput側で処理）
  if (stage === 'prelude' && (e.code === 'Space' || e.key === 'Enter')) { skipPrelude = true; return; }
  if (e.code === 'Space') { e.preventDefault(); nextMode(); }
  const key = e.key.toLowerCase();
  if (key === 'n') narrate();
  if (key === 's') stressBoost = stressBoost ? 0 : 0.7;   // 演出用：緊張を上げてブラックホールを出す
  if (key === 'e') toggleEnding();                        // 締めの一文
  if (key === 'r') startNewWeek();                        // 次の人（審査員）へ
  if (key === 'h') document.body.classList.toggle('hide-hud');
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

$('start').onclick = async () => {
  $('intro').style.opacity = 0; setTimeout(() => ($('intro').style.display = 'none'), 1000);
  try { await initAudio(); } catch (e) { console.warn(e); }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' }, audio: false });
    video.srcObject = stream; await video.play();
    videoReady = true;
    if (video.videoWidth) WORLD_W = WORLD_H * video.videoWidth / video.videoHeight;
    initSegmenter();
    setInterval(lifaceTick, CONFIG.LIFACE_INTERVAL_MS);
  } catch (e) {
    console.warn('camera unavailable — タッチ操作で続行', e);
  }
  showWeekForm();
};


/* ============================================================
   外の宇宙 → 内の宇宙 のブリッジ
   親フレーム（地球を守る宇宙の目）から届く実観測データを、
   この宇宙の物理に流し込む。現実の観測が、あなたの宇宙に星を生む。
   ============================================================ */
const REAL_KEY = "inner-cosmos:real-stars";
let realLive = null, realStars = 0, realSeen = new Set(), realLog = [];

function saveReal() {
  try { localStorage.setItem(REAL_KEY, JSON.stringify(realLog.slice(-PERM))); } catch (e) { /* 保存できなくても動く */ }
}
function restoreReal() {
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem(REAL_KEY) || "[]"); } catch (e) { return; }
  if (!Array.isArray(saved)) return;
  for (const r of saved.slice(-PERM)) {
    if (!r || !r.k) continue;
    realSeen.add(r.k); realLog.push(r); realStars++;
    try { spawnSpark(r.x, r.y, r.z, r.s || 0.9, 0, 0, true, r.hue != null ? r.hue : 0.55); } catch (e) { /* 描画前なら諦める */ }
  }
}
function applyReal(d) {
  if (!d) return;
  realLive = d;
  const el = $('h-real');
  if (el) {
    const ty = d.typhoons?.[0];
    el.innerHTML = '<b style="color:#7fd8ff">外の宇宙（実観測）</b><br>'
      + (ty ? `🌀 台風${ty.number}号 ${ty.name}／${ty.pressure || '-'}hPa<br>` : '🌀 台風なし<br>')
      + (d.top?.length ? d.top.slice(0, 2).map((h) => `${h.icon} ${h.name} ${Math.round(h.score)}`).join('<br>') + '<br>' : '')
      + (d.iss ? `🛰 ISS 高度${Math.round(d.iss.alt)}km／${d.iss.visible ? '日照中' : '地球の影'}<br>` : '')
      + (d.kp != null ? `☀ 地磁気Kp ${d.kp.toFixed(1)}` : '');
  }
  // 実イベントは、この宇宙に実際の星として生まれる（重複は1回だけ）
  const events = [];
  if (d.typhoons) d.typhoons.forEach((t) => events.push({ k: 'ty' + t.number, hue: 0.55, s: 1.0, label: `台風${t.number}号 ${t.name || ''}`.trim() }));
  if (d.top) d.top.forEach((h) => { if (h.score >= 25) events.push({ k: 'hz' + h.label + Math.round(h.score / 10), hue: h.label === '猛暑' ? 0.08 : 0.0, s: 0.8, label: `${h.label} ${h.name} ${Math.round(h.score)}` }); });
  if (d.kp != null && d.kp >= 4) events.push({ k: 'kp' + Math.round(d.kp), hue: 0.3, s: 0.9, label: `地磁気 Kp${d.kp.toFixed(1)}` });
  for (const e of events) {
    if (realSeen.has(e.k)) continue;
    realSeen.add(e.k); realStars++;
    const a = Math.random() * Math.PI * 2, r = 6 + Math.random() * 3;
    const now = new Date();
    const rec = { k: e.k, x: Math.cos(a) * r, y: (Math.random() - 0.5) * 4, z: Math.sin(a) * r,
      s: e.s, hue: e.hue, label: e.label || e.k,
      ts: `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}` };
    realLog.push(rec); saveReal();
    try { spawnSpark(rec.x, rec.y, rec.z, rec.s, 0, 0, true, rec.hue); } catch (err) { /* not ready yet */ }
  }
  renderRealBadge();
}

// 現実から届いた星を、後席からも読める大きさで出す
function renderRealBadge() {
  const b = $('real-badge');
  if (!b) return;
  if (!realStars) { b.style.display = 'none'; return; }
  b.style.display = '';
  const recent = realLog.slice(-3).reverse()
    .map((r) => `<em>${r.ts || ''}</em> ${r.label || r.k}`).join('<br>');
  b.innerHTML = `<b>${realStars}</b><span>現実から届いた星</span><div class="rlog">${recent}</div>`;
}
window.addEventListener('message', (ev) => {
  if (ev.data && ev.data.type === 'earth-eye:live') applyReal(ev.data.payload);
});
restoreReal();
renderRealBadge();
restoreConstellations();
$('btn-const')?.addEventListener('click', () => toggleConstellation());
try { parent.postMessage({ type: 'inner:ready' }, '*'); } catch (e) {}

window.__cosmos = { get starsBorn() { return starsBorn; }, get stage() { return stage; }, get mode() { return mode; },
  get fps() { return Math.round(fps); }, get videoReady() { return videoReady; }, get activity() { return activity; },
  get bh() { return bhStrength; }, get ending() { return ending; }, get weekDensity() { return weekDensity; },
  get weekSummary() { return weekSummary; }, get weekCount() { return weekItems.length; },
  get realStars() { return realStars; }, get realLive() { return realLive; }, get realLog() { return realLog; }, applyReal, renderRealBadge,
  get constellations() { return conste.done; }, get drawing() { return conste.on; },
  drawMode: (on) => toggleConstellation(on), finale: bigBangFinale, get banging() { return bang.on; },
  forgetConstellations: () => { try { localStorage.removeItem(CONST_KEY); } catch (e) {}
    conste.done.length = 0; cCount = 0; eCount = 0; universeDone = false;
    cGeo.setDrawRange(0, 0); eGeo.setDrawRange(0, 0); updateConsteBadge(); },
  forgetReal: () => { try { localStorage.removeItem(REAL_KEY); } catch (e) {} realSeen.clear(); realLog.length = 0; realStars = 0; renderRealBadge(); },
  submitWeek: (text) => { $('week-input').value = text; submitWeek(); } };
</script>
